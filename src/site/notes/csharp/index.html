<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes">
<meta name="description" content="MokiDown C# 笔记：左侧知识树，右侧 Markdown 阅读，支持左右翻页与双指缩放。">
<title>C# 笔记 · MokiDown</title>
<script>
try {
  var theme = new URLSearchParams(location.search).get('theme')
    || localStorage.getItem('mokidown-home-theme')
    || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.dataset.theme = theme;
} catch {}
</script>
<link rel="stylesheet" href="./notes.css">
<link rel="stylesheet" href="./markdown-preview.css">
<link rel="stylesheet" href="./notes-viewer.css">
<link rel="stylesheet" href="./notes-tokens.css">
<script src="./notes-viewer.js" defer></script>
<script src="./notes.js" defer></script>
</head>
<body>
<button type="button" class="notes-tree-toggle" id="notes-tree-toggle" aria-label="展开目录" aria-expanded="false">
  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
</button>

<!-- Screen-edge pager zones: the arrow appears only while the pointer is on that edge. -->
<div class="notes-pager-zone notes-pager-zone--prev" id="notes-prev-zone">
  <button type="button" class="notes-pager" id="notes-prev" aria-label="上一篇" title="上一篇（←）">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 4 6.5 12l8 8"/></svg>
  </button>
</div>
<div class="notes-pager-zone notes-pager-zone--next" id="notes-next-zone">
  <button type="button" class="notes-pager" id="notes-next" aria-label="下一篇" title="下一篇（→）">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 4l8 8-8 8"/></svg>
  </button>
</div>

<div class="notes-layout">
  <aside class="notes-sidebar" id="notes-sidebar" aria-label="笔记大纲">
    <div class="moki-tree knowledge-tree notes-panel">
      <div class="moki-tree__toolbar notes-panel__head">
        <span class="notes-card__file" id="notes-file">mgtree</span>
        <span class="notes-sidebar__count" id="notes-count">0</span>
        <span class="notes-card__actions">
          <button type="button" id="notes-expand-all" title="展开全部" aria-label="展开全部"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg></button>
          <button type="button" id="notes-collapse-all" title="折叠全部" aria-label="折叠全部"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polyline points="4 14 10 14 10 20"/><polyline points="20 10 14 10 14 4"/><line x1="14" y1="10" x2="21" y2="3"/><line x1="3" y1="21" x2="10" y2="14"/></svg></button>
        </span>
      </div>
      <div class="knowledge-tree__list">
        <div class="moki-tree__scroll">
          <div class="moki-tree__canvas">
            <div id="notes-tree"></div>
          </div>
        </div>
      </div>
    </div>
  </aside>

  <div class="notes-resizer" id="notes-resizer" role="separator" aria-orientation="vertical" aria-label="调节大纲宽度" tabindex="0" title="拖拽调节宽度，双击重置"></div>

  <main class="notes-main">
    <div class="notes-main__actions">
      <span class="notes-position" id="notes-position">–</span>
      <span class="notes-zoom">
        <button type="button" class="notes-action" id="notes-zoom-out" aria-label="缩小" title="缩小">−</button>
        <span class="notes-zoom__label" id="notes-zoom-label">100%</span>
        <button type="button" class="notes-action" id="notes-zoom-in" aria-label="放大" title="放大">＋</button>
      </span>
      <button id="theme-toggle" class="notes-action" type="button" aria-label="切换深浅主题" title="切换主题">
        <svg class="theme-icon theme-icon--sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.1"/><path d="M12 2.2v2.4M12 19.4v2.4M2.2 12h2.4M19.4 12h2.4M4.9 4.9l1.7 1.7M17.4 17.4l1.7 1.7M4.9 19.1l1.7-1.7M17.4 6.6l1.7-1.7"/></svg>
        <svg class="theme-icon theme-icon--moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 14.4A8.9 8.9 0 0 1 9.6 3.2 8.9 8.9 0 1 0 20.8 14.4Z"/><path d="M17.6 3.2v2M16.6 4.2h2"/></svg>
      </button>
      <button id="notes-settings" class="notes-action" type="button" aria-label="外观设置" title="外观设置">
        <svg class="theme-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.4v2.2M12 19.4v2.2M2.4 12h2.2M19.4 12h2.2M5.2 5.2l1.6 1.6M17.2 17.2l1.6 1.6M5.2 18.8l1.6-1.6M17.2 6.8l1.6-1.6"/></svg>
      </button>
    </div>

    <div class="notes-appearance" id="notes-appearance" hidden>
      <label class="notes-appearance__row notes-appearance__row--switch">
        <span>启用背景图</span>
        <input type="checkbox" id="notes-bg-enabled" checked>
      </label>
      <label class="notes-appearance__row">
        <span>背景图片</span>
        <input type="file" id="notes-bg-file" accept="image/*">
      </label>
      <label class="notes-appearance__row">
        <span>明亮遮罩</span>
        <input type="range" id="notes-bg-light" min="0" max="100" step="1" value="40">
      </label>
      <label class="notes-appearance__row">
        <span>暗色遮罩</span>
        <input type="range" id="notes-bg-dark" min="0" max="100" step="1" value="40">
      </label>
      <button type="button" class="notes-appearance__clear" id="notes-bg-clear">清除背景</button>
    </div>

    <div class="notes-preview-scroll" id="notes-preview-scroll">
      <div id="notes-preview">
        <p class="notes-placeholder">正在加载笔记…</p>
      </div>
    </div>
  </main>
</div>

<script>
// Mobile: slide-in outline.
(function () {
  var toggle = document.getElementById('notes-tree-toggle');
  var sidebar = document.getElementById('notes-sidebar');
  if (!toggle || !sidebar) return;
  toggle.addEventListener('click', function () {
    var open = sidebar.classList.toggle('is-open');
    toggle.setAttribute('aria-expanded', String(open));
  });
  sidebar.addEventListener('click', function (event) {
    if (event.target.closest('.moki-tree__title')) {
      sidebar.classList.remove('is-open');
      toggle.setAttribute('aria-expanded', 'false');
    }
  });
})();
</script>
</body>
</html>
