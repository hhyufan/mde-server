<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes">
<meta name="description" content="MokiDown C# 笔记：左侧知识树，右侧 Markdown 阅读，支持左右翻页与双指缩放。">
<title>C# 笔记 · MokiDown</title>
<script>
try {
  var theme = new URLSearchParams(location.search).get('theme')
    || localStorage.getItem('mokidown-home-theme')
    || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.dataset.theme = theme;
} catch {}
</script>
<link rel="stylesheet" href="./notes.css">
<link rel="stylesheet" href="./markdown-preview.css">
<link rel="stylesheet" href="./notes-viewer.css">
<script src="./notes-viewer.js" defer></script>
<script src="./notes.js" defer></script>
</head>
<body>
<header class="notes-header">
  <button type="button" class="notes-tree-toggle" id="notes-tree-toggle" aria-label="展开目录" aria-expanded="false">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
  </button>
  <a class="brand" href="https://www.miaogu.xyz" aria-label="MokiDown">
    <span style="font-weight:700;font-size:15px;letter-spacing:-0.02em;color:var(--text);">MokiDown</span>
  </a>
  <span class="notes-header__divider"></span>
  <span class="notes-header__title">C# 笔记</span>
  <span class="notes-header__spacer"></span>
  <button type="button" class="notes-toolbar__btn" id="notes-prev" aria-label="上一篇" title="上一篇（←）">‹</button>
  <span class="notes-position" id="notes-position">–</span>
  <button type="button" class="notes-toolbar__btn" id="notes-next" aria-label="下一篇" title="下一篇（→）">›</button>
  <span class="notes-zoom">
    <button type="button" class="notes-toolbar__btn" id="notes-zoom-out" aria-label="缩小" title="缩小">−</button>
    <span class="notes-zoom__label" id="notes-zoom-label">100%</span>
    <button type="button" class="notes-toolbar__btn" id="notes-zoom-in" aria-label="放大" title="放大">＋</button>
  </span>
  <button id="theme-toggle" class="icon-button" type="button" aria-label="切换深浅主题" title="切换主题">
    <svg class="theme-icon theme-icon--sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.66 6.34l1.41-1.41"/></svg>
    <svg class="theme-icon theme-icon--moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5 8.5 8.5 0 1 0 20.5 14.2Z"/></svg>
  </button>
</header>

<div class="notes-layout">
  <aside class="notes-sidebar" id="notes-sidebar" aria-label="笔记大纲">
    <div class="notes-sidebar__head">
      <span id="notes-tree-title">知识树</span>
      <span class="notes-sidebar__count" id="notes-count">0</span>
    </div>
    <div class="moki-tree knowledge-tree notes-panel">
      <div class="moki-tree__toolbar notes-panel__head">
        <span class="notes-card__file" id="notes-file">mgtree</span>
        <span class="notes-card__actions">
          <button type="button" id="notes-expand-all" title="展开全部" aria-label="展开全部"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg></button>
          <button type="button" id="notes-collapse-all" title="折叠全部" aria-label="折叠全部"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polyline points="4 14 10 14 10 20"/><polyline points="20 10 14 10 14 4"/><line x1="14" y1="10" x2="21" y2="3"/><line x1="3" y1="21" x2="10" y2="14"/></svg></button>
        </span>
      </div>
      <div class="knowledge-tree__list">
        <div class="moki-tree__scroll">
          <div class="moki-tree__canvas">
            <div id="notes-tree"></div>
          </div>
        </div>
      </div>
    </div>
  </aside>

  <div class="notes-resizer" id="notes-resizer" role="separator" aria-orientation="vertical" aria-label="调节大纲宽度" tabindex="0" title="拖拽调节宽度，双击重置"></div>

  <main class="notes-main">
    <div class="notes-preview-scroll" id="notes-preview-scroll">
      <div id="notes-preview">
        <p class="notes-placeholder">正在加载笔记…</p>
      </div>
    </div>
  </main>
</div>

<script>
// Mobile: slide-in outline.
(function () {
  var toggle = document.getElementById('notes-tree-toggle');
  var sidebar = document.getElementById('notes-sidebar');
  if (!toggle || !sidebar) return;
  toggle.addEventListener('click', function () {
    var open = sidebar.classList.toggle('is-open');
    toggle.setAttribute('aria-expanded', String(open));
  });
  sidebar.addEventListener('click', function (event) {
    if (event.target.closest('.notes-node__title')) {
      sidebar.classList.remove('is-open');
      toggle.setAttribute('aria-expanded', 'false');
    }
  });
})();
</script>
</body>
</html>
